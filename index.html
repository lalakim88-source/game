<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETRIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="brand">
      <h1>TETRIS</h1>
      <p>블록을 맞춰 라인을 지우세요</p>
    </header>

    <main class="stage">
      <aside class="panel left">
        <section class="stat-block">
          <h2>점수</h2>
          <p id="score">0</p>
        </section>
        <section class="stat-block">
          <h2>레벨</h2>
          <p id="level">1</p>
        </section>
        <section class="stat-block">
          <h2>라인</h2>
          <p id="lines">0</p>
        </section>
      </aside>

      <div class="board-wrap">
        <canvas id="board" width="300" height="600" aria-label="테트리스 보드"></canvas>
        <div id="overlay" class="overlay">
          <div class="overlay-card">
            <h2 id="overlay-title">TETRIS</h2>
            <p id="overlay-msg">스페이스로 시작</p>
            <button id="start-btn" type="button">시작</button>
          </div>
        </div>
      </div>

      <aside class="panel right">
        <section class="preview-block">
          <h2>다음</h2>
          <canvas id="next" width="120" height="120" aria-label="다음 블록"></canvas>
        </section>
        <section class="controls">
          <h2>조작</h2>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> 이동</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> 회전</li>
            <li><kbd>↓</kbd> 소프트 드롭</li>
            <li><kbd>Space</kbd> 하드 드롭</li>
            <li><kbd>P</kbd> 일시정지</li>
          </ul>
        </section>
      </aside>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
